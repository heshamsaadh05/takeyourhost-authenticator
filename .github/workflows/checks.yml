name: Portable packaging checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shell and Python syntax
        run: |
          for f in install.sh update.sh uninstall.sh scripts/test-cpanel.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/manage.py qr-svg.py
          perl -c scripts/native.pl
      - name: Isolated installer and independent QR checks
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
          sudo .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
